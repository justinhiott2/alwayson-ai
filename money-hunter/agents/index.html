<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autonomous Agent Report</title><style>body{font:16px system-ui;max-width:1000px;margin:auto;padding:18px;background:#0b1220;color:#eef3fa}h1,h2{color:#e8bd58}.card{border:1px solid #34445d;border-radius:12px;padding:14px;margin:12px 0;background:#121a29}a{color:#f0ca70}.muted{color:#a9b5c8}.tag{font-size:12px;background:#293951;padding:3px 8px;border-radius:20px}</style></head><body><h1>Money Hunter — Autonomous Agent Reports</h1><p class="muted">Free scheduled public-source scans. Each result is a lead or source pointer, not proof of ownership, a live bid, or earned revenue.</p><p><a href="../index.html">Main app</a> · <a href="../bots/index.html">Individual bots</a></p><div id="status" class="card">Loading latest report…</div><div id="results"></div><script>fetch('./latest.json?'+Date.now()).then(r=>{if(!r.ok)throw Error('No completed report yet');return r.json()}).then(d=>{document.getElementById('status').innerHTML='<b>Last run:</b> '+new Date(d.generated_at).toLocaleString()+'<br><b>Findings:</b> '+d.counts.total+' · <b>Errors:</b> '+d.counts.errors+'<p class="muted">'+d.important+'</p>';document.getElementById('results').innerHTML=d.results.map(x=>'<article class="card"><span class="tag">'+x.agent+'</span> <span class="tag">'+x.status+'</span><h2>'+esc(x.title)+'</h2><p>'+esc(x.summary)+'</p><p><a href="'+esc(x.url)+'" target="_blank" rel="noopener">Open source ↗</a></p><p class="muted"><b>Next step:</b> '+esc(x.next_action)+'</p></article>').join('')}).catch(e=>document.getElementById('status').textContent=e.message+' — run the workflow manually or wait for the next scheduled scan.');function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
