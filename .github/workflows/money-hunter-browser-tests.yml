name: Money Hunter Browser Test Bot
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "money-hunter/**"
      - "scripts/test_money_hunter_browser.mjs"
      - ".github/workflows/money-hunter-browser-tests.yml"
permissions:
  contents: read
concurrency:
  group: money-hunter-browser-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out app
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser test dependency
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static test server
        run: |
          python3 -m http.server 4173 --directory . > /tmp/money-hunter-test-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/money-hunter/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/money-hunter-test-server.log
          exit 1
      - name: Run isolated mobile browser tests
        env:
          APP_BASE_URL: http://127.0.0.1:4173/money-hunter/
        run: node scripts/test_money_hunter_browser.mjs
      - name: Upload test report and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: money-hunter-browser-test-${{ github.run_number }}
          path: |
            money-hunter/reports/browser-test.json
            money-hunter-browser-test.png
          if-no-files-found: warn
          retention-days: 30
