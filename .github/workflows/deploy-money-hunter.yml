name: Deploy Money Hunter AI to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'money-hunter/**'
      - '.github/workflows/deploy-money-hunter.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: money-hunter-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Money Hunter artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: money-hunter
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
