name: Money Hunter source monitor

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: money-hunter-source-monitor
  cancel-in-progress: false

jobs:
  check-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run official-source monitor
        run: python scripts/money_hunter_source_monitor.py
      - name: Publish updated dashboard report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add money-hunter/reports/latest.json
          if git diff --cached --quiet; then
            echo "No report changes to publish."
          else
            git commit -m "chore: refresh Money Hunter source monitor"
            git push
          fi
