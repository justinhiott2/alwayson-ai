name: Money Hunter Stripe Setup Bot

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/money-hunter-stripe-setup.yml"
  pull_request:
    paths:
      - "money-hunter/scripts/stripe-setup-bot.mjs"
      - "money-hunter/cloud.js"
      - "money-hunter/index.html"
      - ".github/workflows/money-hunter-stripe-setup.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SETUP to provision the Stripe webhook and sync Supabase secrets (live checkout stays disabled)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' || inputs.confirm == 'SETUP' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check setup bot syntax
        run: node --check money-hunter/scripts/stripe-setup-bot.mjs
      - name: Check browser billing module syntax
        run: node --input-type=module --check < money-hunter/cloud.js

  setup:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm == 'SETUP') || github.event_name == 'push' }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Stripe setup bot
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: unjulxbkxnscwkxlmtbd
          STRIPE_WEBHOOK_ENDPOINT_ID: ${{ vars.STRIPE_WEBHOOK_ENDPOINT_ID }}
        run: node money-hunter/scripts/stripe-setup-bot.mjs
