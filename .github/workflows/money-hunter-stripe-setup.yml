name: Money Hunter Stripe Setup Bot

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SETUP to provision the Stripe webhook and sync Supabase secrets (live checkout stays disabled)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  setup:
    if: ${{ inputs.confirm == 'SETUP' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Stripe setup bot
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: unjulxbkxnscwkxlmtbd
          STRIPE_WEBHOOK_ENDPOINT_ID: ${{ vars.STRIPE_WEBHOOK_ENDPOINT_ID }}
        run: node money-hunter/scripts/stripe-setup-bot.mjs
