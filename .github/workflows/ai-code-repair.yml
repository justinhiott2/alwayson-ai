name: AI Code Repair Agent
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number describing the repair
        required: true
        type: string
  issues:
    types: [opened, labeled]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: ai-repair-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || (!github.event.issue.pull_request && (startsWith(github.event.issue.title, '[AI repair]') || github.event.label.name == 'ai-repair'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve issue number
        id: issue
        env:
          INPUT_ISSUE: ${{ inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          NUMBER="$EVENT_ISSUE"
          if [ -z "$NUMBER" ]; then NUMBER="$INPUT_ISSUE"; fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
      - name: Create isolated repair branch
        id: branch
        run: |
          BRANCH="ai-repair/issue-${{ steps.issue.outputs.number }}-${{ github.run_id }}"
          git switch -c "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Ask Gemini to propose a guarded code patch
        id: agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ai_repair_agent.py
      - name: Run safety and syntax checks
        if: steps.agent.outcome == 'success'
        run: |
          git diff --check
          python -m compileall -q scripts
          python scripts/app_maintenance_bot.py
          if command -v node >/dev/null 2>&1; then
            find money-hunter -name '*.js' -print0 | xargs -0 -r -n1 node --check
          fi
      - name: Push repair branch
        if: steps.agent.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- money-hunter
          git commit -m "fix: AI-proposed repair for issue #${{ steps.issue.outputs.number }}"
          git push origin "${{ steps.branch.outputs.name }}"
      - name: Open draft pull request
        if: steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --draft --base main --head "${{ steps.branch.outputs.name }}" \
            --title "AI repair proposal for issue #${{ steps.issue.outputs.number }}" \
            --body "Automated repair proposal generated from issue #${{ steps.issue.outputs.number }}. Review every changed line before merging. This workflow never merges or deploys automatically."
      - name: Explain model connection failure
        if: steps.agent.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.issue.outputs.number }}" --body "The AI repair agent did not complete. Check this workflow run's logs. Confirm GEMINI_API_KEY is a valid Google AI Studio key and that Gemini API quota is available. No production code was deployed."
